[project]
name = "telemetry-suff-bench-artifact"
version = "0.1.0"
description = "Offline artifact for reconstructing and scoring TelemetrySuffBench protocols."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_suff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
